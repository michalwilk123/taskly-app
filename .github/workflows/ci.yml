name: CI
run-name: 'CI · ${{ (github.event.pull_request.number || inputs.pr_number) && format(''PR #{0}'', github.event.pull_request.number || inputs.pr_number) || github.ref_name }}'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number when dispatched after an agent commit
        type: string
      sha:
        description: Exact PR commit to verify when dispatched by the agent
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}

  report:
    needs: checks
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # Dispatched workflow checks attach to main; publish the result on the PR SHA.
      - name: Report verification on the tested PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          RESULT: ${{ needs.checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='PR verification' -f head_sha="$TARGET_SHA" \
            -f status=completed -f conclusion="$RESULT" -f details_url="$RUN_URL" \
            -f 'output[title]'="Tests and static checks: $RESULT" \
            -f 'output[summary]'="Verification of commit $TARGET_SHA. Logs: $RUN_URL"

  review:
    needs: checks
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    uses: ./.github/workflows/agent-worker.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      sha: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      mode: review
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
