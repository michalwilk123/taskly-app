name: Test agent commands
run-name: 'Test agent · PR #${{ github.event.issue.number || github.event.pull_request.number }}'

on:
  issue_comment:
    types: [created]
  # Cancellation reads metadata only, using the trusted default-branch workflow.
  pull_request_target:
    types: [synchronize, closed]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.body == 'generate tests' && github.event.sender.type != 'Bot') ||
      (github.event_name == 'pull_request_target' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      mode: ${{ steps.authorize.outputs.mode }}
      number: ${{ steps.authorize.outputs.number }}
    steps:
      - name: Authorize before entering PR concurrency group
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if os.environ['GITHUB_EVENT_NAME'] == 'issue_comment':
              repo = os.environ['GITHUB_REPOSITORY']
              login = event['sender']['login']
              access = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/collaborators/{login}/permission']))
              if access['role_name'] not in ('maintain', 'admin'):
                  raise SystemExit('Only maintainers may generate tests')
              number, mode = event['issue']['number'], 'generate'
          else:
              number, mode = event['pull_request']['number'], 'cancel'
              pr = event['pull_request']
              repo = os.environ['GITHUB_REPOSITORY']
              if not pr['head']['repo'] or pr['head']['repo']['full_name'] != repo:
                  raise SystemExit('Fork PRs do not run the test agent')
              for status in ('in_progress', 'queued', 'waiting', 'pending'):
                  runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs?status={status}&per_page=100']))['workflow_runs']
                  for run in runs:
                      same_pr = run['head_branch'] == pr['head']['ref'] or run['display_title'] == f'CI · PR #{number}'
                      old_ci = run['path'] == '.github/workflows/ci.yml' and run['head_repository']['full_name'] == repo and same_pr and (event['action'] == 'closed' or run['head_sha'] != pr['head']['sha'])
                      old_command = run['path'] == '.github/workflows/test-agent.yml' and run['event'] == 'issue_comment' and run['display_title'] == f'Test agent · PR #{number}'
                      if old_ci or old_command:
                          subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{repo}/actions/runs/{run['id']}/cancel"], check=False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'number={number}\nmode={mode}\n')
          PY

  agent:
    needs: authorize
    if: needs.authorize.outputs.mode == 'generate'
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    uses: ./.github/workflows/agent-worker.yml
    with:
      pr_number: ${{ needs.authorize.outputs.number }}
      mode: ${{ needs.authorize.outputs.mode }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
