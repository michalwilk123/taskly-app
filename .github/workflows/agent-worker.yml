name: Pi test agent worker

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      sha:
        default: ''
        type: string
      mode:
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: pi-test-agent-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  agent:
    if: inputs.mode != 'cancel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve current PR and authorize command
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.sha }}
        run: python automation/scripts/test_agent.py prepare --work "$RUNNER_TEMP/taskly-agent"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned Pi runtime
        run: docker build -t taskly-pi automation/.github/agent
      - name: Run Pi in isolated workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python automation/scripts/test_agent.py run --source source --work "$RUNNER_TEMP/taskly-agent"
      - name: Publish review and red or green check
        if: steps.prepare.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/scripts/test_agent.py review --work "$RUNNER_TEMP/taskly-agent"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.mode == 'generate'
        with:
          name: test-proposal
          path: ${{ runner.temp }}/taskly-agent/result.json
          retention-days: 7

  verify:
    needs: agent
    if: needs.agent.outputs.mode == 'generate'
    uses: ./.github/workflows/checks.yml
    with:
      sha: ${{ needs.agent.outputs.sha }}
      proposal: true

  publish:
    needs: [agent, verify]
    # Test failure is a useful outcome: publish tests without repairing them.
    if: >-
      always() && !cancelled() && needs.agent.outputs.mode == 'generate' &&
      needs.verify.outputs.applied == 'success' &&
      (needs.verify.outputs.result == 'success' || needs.verify.outputs.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.agent.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-proposal
          path: proposal
      - name: Commit tests and report verification
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.verify.outputs.result }}
        run: python automation/scripts/test_agent.py commit --source source --work proposal
